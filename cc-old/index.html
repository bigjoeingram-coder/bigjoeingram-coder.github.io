<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Ingram Command · Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020409;--line:rgba(70,140,255,.26);--blue:#2f8cff;--azure:#36c8ff;--chrome:#d7dee8;--dim:#8391a6;--fuchsia:#ff2bd6;--green:#2ee59d;--amber:#ffb020;--red:#ff3b4e;--gray:#5d6676;--orange:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--chrome);font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-size:17px}
body{background:radial-gradient(1400px 700px at 50% -20%,rgba(47,140,255,.18),transparent 70%),var(--bg);overflow:hidden}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(47,140,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,255,.045) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.mono{font-family:'JetBrains Mono',monospace}
#app{position:relative;height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding:14px 20px}
/* header */
header{display:flex;align-items:center;gap:18px}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:24px;letter-spacing:2px;background:linear-gradient(180deg,#fff,#93a7c2 55%,#e8eef6);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.clock{font-size:26px;font-weight:700;color:#fff}
.hdr-sp{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:15px;color:var(--dim);white-space:nowrap}
.pill b{color:var(--chrome)}
.pill.live b{color:var(--green)}.pill.stale{border-color:var(--amber)}.pill.stale b{color:var(--amber)}.pill.err{border-color:var(--red)}.pill.err b{color:var(--red)}
button,.btn{font:inherit;font-weight:700;font-size:15px;color:var(--chrome);background:rgba(47,140,255,.12);border:1px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--blue);color:#fff}
/* partner strip */
#partners{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.partner{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(14,26,48,.9),rgba(4,8,16,.9));position:relative;overflow:hidden;cursor:pointer}
.partner:hover{border-color:rgb(var(--pc))}
.partner .orb{width:84px;height:84px;border-radius:50%;flex:none;position:relative}
.partner .orb img{width:100%;height:100%;border-radius:50%;object-fit:cover;filter:saturate(.9) contrast(1.05);border:3px solid rgb(var(--pc))}
.partner .orb:before{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(var(--pc),.55);animation:breathe 3.2s ease-in-out infinite}
.partner .orb.busy:after{content:'';position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 26px rgba(var(--pc),.7);animation:breathe 1.6s ease-in-out infinite}
.partner .rock{position:absolute;right:-6px;bottom:-4px;width:30px;height:24px;clip-path:polygon(18% 8%,62% 0,96% 30%,88% 82%,40% 100%,4% 70%);background:var(--rock);border:0;box-shadow:0 0 0 2px rgba(215,222,232,.85)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.06);opacity:1}}
.partner .who{flex:1;min-width:0}
.partner .nm{font-family:Orbitron,sans-serif;font-weight:900;font-size:22px;color:#fff;letter-spacing:2px}
.partner .role{font-size:14px;font-weight:700;letter-spacing:2px;color:rgb(var(--pc))}
.partner .team{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dotname{font-size:14px;display:flex;align-items:center;gap:5px;color:var(--chrome)}
.dotname i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.partner .util{text-align:right}
.partner .util .pct{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:800;color:var(--uc);line-height:1}
.partner .util small{display:block;color:var(--dim);font-size:13px}
/* sections */
#board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.sec{border:1px solid var(--line);border-radius:16px;background:linear-gradient(170deg,rgba(13,25,46,.92),rgba(3,7,14,.94));padding:12px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;cursor:pointer;position:relative;transition:border-color .2s,transform .2s}
.sec:hover{border-color:rgb(var(--sc));transform:translateY(-1px)}
.sec:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:rgb(var(--sc));opacity:.9}
.sec h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:2px;color:rgb(var(--sc));margin-bottom:8px}
.sec h3 .tag{margin-left:auto}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:6px;border:1px solid}
.tag.live{color:var(--green);border-color:rgba(46,229,157,.5)}.tag.stale{color:var(--amber);border-color:var(--amber)}.tag.nofeed{color:var(--gray);border-color:var(--gray)}
.big{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:40px;color:#fff;line-height:1}
.big small{font-family:'Barlow Semi Condensed';font-size:16px;color:var(--dim);font-weight:600;margin-left:8px}
.rows{flex:1;min-height:0;overflow:hidden;margin-top:6px}
.r{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(70,140,255,.12);font-size:15.5px}
.r .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .m{color:var(--dim);font-size:13.5px;white-space:nowrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;padding:1px 6px;border-radius:5px;border:1px solid var(--dim);color:var(--dim);white-space:nowrap}
.chip.amber{border-color:var(--amber);color:var(--amber)}.chip.red{border-color:var(--red);color:var(--red)}.chip.fuchsia{border-color:var(--fuchsia);color:var(--fuchsia)}.chip.green{border-color:var(--green);color:var(--green)}.chip.azure{border-color:var(--azure);color:var(--azure)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.src{font-size:12px;color:var(--gray);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nofeedbox{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--gray);font-weight:800;letter-spacing:2px;gap:6px;text-align:center}
.nofeedbox span{font-weight:500;letter-spacing:0;font-size:14px;max-width:260px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0}
.stat{border:1px solid rgba(70,140,255,.16);border-radius:10px;padding:6px 8px}
.stat b{display:block;font-family:'JetBrains Mono';font-size:24px;color:var(--c,#fff)}
.stat span{font-size:12.5px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
/* expanded overlay */
#scrim{position:fixed;inset:0;background:rgba(1,3,8,.72);backdrop-filter:blur(3px);display:none;z-index:20}
#scrim.on{display:block}
#xp{position:fixed;left:50%;top:50%;width:min(1180px,92vw);height:min(780px,82vh);transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;z-index:21;transition:all .25s;cursor:default}
#xp.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#xp .sec{height:100%;cursor:default;padding:20px 26px}
#xp .sec:hover{transform:none}
#xp .r{font-size:17px;padding:7px 0}
#xp .rows{overflow:auto}
#xp h3{font-size:20px}
.close{position:absolute;right:16px;top:12px;z-index:2}
table{width:100%;border-collapse:collapse;font-size:15.5px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07101e}
td{padding:6px 8px;border-bottom:1px solid rgba(70,140,255,.1);vertical-align:top}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:0;flex:1}
.cols>div{min-height:0;overflow:auto}
h4{font-size:13px;letter-spacing:2px;color:var(--dim);margin:8px 0 4px}
a{color:var(--azure)}
/* command bar */
#cmd{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:rgba(6,12,24,.95);padding:8px 12px}
#cmd .pr{font-family:'JetBrains Mono';font-weight:800;color:var(--blue)}
#cmd input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:18px}
#cmdout{position:fixed;left:20px;right:20px;bottom:72px;z-index:30;display:none}
#cmdout.on{display:block}
#cmdout .card{max-width:820px;margin:0 auto;border:1px solid var(--blue);border-radius:14px;background:#06101f;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#cmdout pre{white-space:pre-wrap;font-family:'JetBrains Mono';font-size:14px;color:#fff;background:rgba(47,140,255,.08);border-radius:8px;padding:10px;margin:8px 0}
#banner{display:none;text-align:center;font-weight:800;letter-spacing:2px;border-radius:10px;padding:4px}
#banner.stale{display:block;color:var(--amber);border:1px solid var(--amber);background:rgba(255,176,32,.1)}
#banner.err{display:block;color:var(--red);border:1px solid var(--red);background:rgba(255,59,78,.1)}
#setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:50;font-size:22px}
@media (max-width:1100px){body{overflow:auto}#app{height:auto}#board{grid-template-columns:1fr 1fr;grid-template-rows:none}#board .sec{height:300px}#partners{grid-template-columns:1fr}}
</style></head>
<body>
<div class="grid-bg"></div>
<div id="setup"><div class="logo" style="font-size:40px">INGRAM COMMAND</div><div id="setupmsg">Open the Boardroom with its private link (it ends in #k=…).</div></div>
<div id="app">
 <header>
  <div class="logo">INGRAM COMMAND</div><div class="clock mono" id="clock"></div><div class="pill" id="date"></div>
  <div class="hdr-sp"></div>
  <div id="banner"></div>
  <div class="pill" id="feedpill">feed <b>connecting…</b></div>

 </header>
 <div id="partners"></div>
 <div id="board"></div>

</div>
<div id="scrim"></div><div id="xp"></div>
<div id="cmdout"></div>
<script src="../common.js"></script>

const $=id=>document.getElementById(id),E=CC.esc;
const SC={working:'var(--green)',idle:'var(--amber)',quiet:'var(--gray)'};
let F=null,D=null,XP=null,LASTOK=0;
const tagOf=s=>s.state==='live'?'<span class="tag live">LIVE</span>':s.state==='stale'?'<span class="tag stale">STALE</span>':'<span class="tag nofeed">NO FEED</span>';
const ageChip=d=>d==null?'':`<span class="chip ${CC.ageClass(d)}">${d}d</span>`;
const nofeed=(why)=>`<div class="nofeedbox">NO FEED<span>${E(why)}</span></div>`;
const src=(s)=>`<div class="src">Source: ${E(s.source||'not connected')}${s.updated_at?' · updated '+CC.ago(s.updated_at):''}</div>`;
const utilColor=f=>f>=BOARD.util.green?'var(--green)':f>=BOARD.util.yellow?'var(--amber)':'var(--red)';
function teamOf(p){return D.roster.filter(r=>(r.partner||'').toLowerCase()===p.key);}

/* ===== section renderers: each returns [tag, summaryHTML, detailHTML] ===== */
const R={
util(){const s=D.agents;if(!s.data)return[s,nofeed('Agent activity not pushed yet'),nofeed('Agent activity not pushed yet')];
  const all=D.roster,act=all.filter(r=>r.state!=='quiet').length,f=all.length?act/all.length:0;
  const sum=`<div class="big" style="color:${utilColor(f)}">${Math.round(f*100)}%<small>${act}/${all.length} active today · ${D.working} working now</small></div>
   <div class="rows">${all.slice(0,8).map(r=>`<div class="r"><span class="dot" style="--c:${SC[r.state]}"></span><span class="t">${E(r.name)} <span class="m">${E(r.doing||'no activity seen')}</span></span><span class="m">${r.last_at?CC.ago(r.last_at):'–'}</span></div>`).join('')}</div>`+src(s);
  const det=`<div class="big" style="color:${utilColor(f)}">${Math.round(f*100)}%<small>active today (seen in last 36 h) · green ≥85% · yellow 50–85% · red &lt;50%</small></div>
   <div class="rows"><table><tr><th>Agent</th><th>Partner</th><th>State</th><th>Last seen</th><th>Doing</th><th>Seen on</th><th>Events 72h</th></tr>
   ${all.map(r=>`<tr><td><span class="dot" style="--c:${SC[r.state]};display:inline-block"></span> <b>${E(r.name)}</b><br><span class="m">${E(r.role)}</span></td><td>${E(r.partner)}</td><td>${r.state}</td><td>${r.last_at?CC.time(r.last_at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT':'never'}</td><td>${E(r.doing||'')}</td><td>${E(r.src||'')}</td><td>${r.events_72h}</td></tr>`).join('')}</table>
   <p class="src">Rule: ${E(s.data.rule)}. Activity comes from Relay rows and Slack posts, so seats that work outside Relay can read as quiet.</p></div>`+src(s);
  return[s,sum,det];},
desk(){const s=D.needs;if(!s.data)return[s,nofeed('Held-for-Joe list not pushed yet'),nofeed('')];
  const I=F.ideas||{},C=F.content||{},items=D.needsItems,bl=D.blockedItems;
  const row=x=>`<div class="r"><span class="dot" style="--c:var(--fuchsia)"></span><span class="t">${E(x.text)}</span><span class="m">${E(x.owner||'')}</span>${ageChip(CC.days(x.since))}</div>`;
  const sum=`<div class="big" style="color:var(--fuchsia)">${items.length}<small>waiting on you · +${I.awaiting??'–'} ideas · ${C.awaiting_joe??'–'} content cards</small></div><div class="rows">${items.slice(0,6).map(row).join('')}</div>`+src(s);
  const det=`<div class="cols"><div><h4>WAITING ON JOE · ${items.length}</h4>${items.map(x=>row(x).replace('</span><span class="m">',`<br><span class="m">${E(x.business||'')} · ${E(x.src||'')}</span></span><span class="m">`)).join('')}
     <h4>ALSO IN YOUR QUEUES</h4><div class="r"><span class="t">IdeaQ cards awaiting your tap</span><b>${I.awaiting??'–'}</b> <a href="${BOARD.links.ideaq}" target="_blank" rel="noopener">open ↗</a></div>
     <div class="r"><span class="t">Content cards awaiting you</span><b>${C.awaiting_joe??'–'}</b> <a href="${BOARD.links.ideaq}" target="_blank" rel="noopener">open ↗</a></div></div>
    <div><h4>BLOCKED · ${bl.length}</h4>${bl.map(x=>`<div class="r"><span class="dot" style="--c:var(--red)"></span><span class="t">${E(x.text)}<br><span class="m">${E(x.business||'')} · ${E(x.src||'')}</span></span><span class="m">${E(x.owner||'')}</span>${ageChip(CC.days(x.since))}</div>`).join('')}</div></div>`+src(s);
  return[s,sum,det];},
sales(){const S=F.sales;const s={state:S?'live':'nofeed',source:'cc.sales ledger (any agent reports a sale; deduped by payment ID)',updated_at:F.generated_at};
  if(!S)return[s,nofeed('Sales ledger offline'),nofeed('')];
  const rows=S.rows||[];
  const sum=`<div class="big" style="color:var(--green)">${CC.money(S.total_today)}<small>today · ${S.count_today} payments</small></div>
   <div class="stats"><div class="stat"><b>${CC.money(S.mtd)}</b><span>Month to date</span></div><div class="stat"><b>${F.phone?F.phone.today:'–'}</b><span>Live call attempts today</span></div><div class="stat"><b>${F.phone?F.phone.last7:'–'}</b><span>Live call attempts 7d</span></div></div>
   <div class="rows">${rows.length?rows.slice(0,5).map(r=>`<div class="r"><span class="t">${E(r.customer||'—')}</span><span class="m">${E(r.reported_by)}</span><b>${CC.money(r.amount)}</b></div>`).join(''):'<div class="r"><span class="t m">No sales reported today. Agents report each sale to the ledger with its payment ID.</span></div>'}</div>`+src(s);
  const det=`<div class="big" style="color:var(--green)">${CC.money(S.total_today)}<small>${S.date_pt} PT · ${S.count_today} payments · MTD ${CC.money(S.mtd)}</small></div>
   <div class="rows"><table><tr><th>Received</th><th>Customer</th><th>Amount</th><th>Reported by</th><th>Also reported by</th><th>Payment ID</th></tr>
   ${rows.map(r=>`<tr><td>${CC.time(r.received_at)}</td><td>${E(r.customer)}</td><td>${CC.money(r.amount)}</td><td>${E(r.reported_by)}</td><td>${E((r.also_reported_by||[]).join(', '))}</td><td class="mono">${E(String(r.payment_id).slice(-6))}</td></tr>`).join('')||'<tr><td colspan=6 class="m">No sales reported today.</td></tr>'}</table>
   <p class="src">Any agent or AI tool posts a sale to the feed (op “sale”). A second report of the same payment ID is merged, not double-counted.</p>
   ${F.phone&&F.phone.last?`<p class="src">Last live call attempt (dry runs excluded): ${CC.time(F.phone.last.at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} PT · seat ${E(F.phone.last.seat)} · ${E(F.phone.last.purpose)} · ${E(F.phone.last.status)}</p>`:''}</div>`+src(s);
  return[s,sum,det];},
relay(){const s=D.relay;if(!s.data||!s.data.available)return[s,nofeed('Relay tail not pushed yet'),nofeed('')];const r=s.data;
  const rowH=x=>`<div class="r"><span class="chip ${/BLOCK/.test(x.status)?'red':/JOE/.test(x.status)?'fuchsia':'azure'}">${E(x.status.slice(0,14))}</span><span class="t">${E(x.what)}</span><span class="m">${E(x.author)} · R${x.row}</span></div>`;
  const pct=r.last7_total?Math.round(100*r.last7_closed/r.last7_total):0;
  const sum=`<div class="stats"><div class="stat" style="--c:var(--azure)"><b>${r.last7_open}</b><span>Open 7d</span></div><div class="stat" style="--c:var(--red)"><b>${r.blocked.length}</b><span>Blocked</span></div><div class="stat" style="--c:var(--fuchsia)"><b>${r.joe_gates.length}</b><span>Joe gates</span></div></div>
   <div class="rows">${r.open.slice(0,5).map(rowH).join('')}</div>`+src(s);
  const det=`<div class="stats" style="grid-template-columns:repeat(5,1fr)"><div class="stat"><b>${r.last7_total}</b><span>Rows since ${r.window_from?CC.time(r.window_from,{month:'short',day:'numeric'}):'–'}</span></div><div class="stat" style="--c:var(--azure)"><b>${r.last7_open}</b><span>Open</span></div><div class="stat" style="--c:var(--green)"><b>${pct}%</b><span>Closed/settled</span></div><div class="stat" style="--c:var(--amber)"><b>${r.p1_open}</b><span>P0/P1 open</span></div><div class="stat"><b>R${r.tail_row}</b><span>Last row ${CC.ago(r.tail_at)}</span></div></div>
   <div class="cols"><div><h4>OPEN (NEWEST FIRST)</h4>${r.open.map(rowH).join('')}</div><div><h4>BLOCKED</h4>${r.blocked.map(rowH).join('')}<h4>ROUTED TO JOE</h4>${r.joe_gates.map(rowH).join('')}<h4>LATEST ROWS</h4>${r.latest.slice(0,6).map(rowH).join('')}<p class="src"><a href="${BOARD.links.relaySheet}" target="_blank" rel="noopener">Open the Relay sheet ↗</a></p></div></div>`+src(s);
  return[s,sum,det];},
score(){const sites=D.sites,r=D.relay.data,I=F.ideas||{},C=F.content||{};
  const s={state:sites.state==='live'&&D.relay.state==='live'?'live':sites.data?'stale':'nofeed',source:'uptime check + Relay + IdeaQ + agents',updated_at:F.generated_at};
  const rel=r&&r.last7_total?r.last7_closed/r.last7_total:null;
  const K=[
    ['Websites active & functioning',D.sitesTotal?(D.sitesUp===D.sitesTotal?'G':'R'):'X',D.sitesTotal?`${D.sitesUp}/${D.sitesTotal} up`:'NO FEED'],
    ['Relay health (settled, last 7 days)',rel==null?'X':rel>=.6?'G':rel>=.4?'Y':'R',rel==null?'NO FEED':Math.round(rel*100)+'% settled'],
    ['Team active today',D.agents.data?((D.active/D.roster.length)>=.85?'G':(D.active/D.roster.length)>=.5?'Y':'R'):'X',D.agents.data?`${D.active}/${D.roster.length}`:'NO FEED'],
    ['Waiting on Joe',D.needs.data?(D.needsItems.length>8?'R':D.needsItems.length>3?'Y':'G'):'X',D.needs.data?`${D.needsItems.length} asks`:'NO FEED'],
    ['IdeaQ awaiting a tap',I.total!=null?(I.awaiting>10?'Y':'G'):'X',I.total!=null?`${I.awaiting} of ${I.total}`:'NO FEED'],
    ['Content cards awaiting Joe',C.awaiting_joe!=null?(C.awaiting_joe>20?'Y':'G'):'X',C.awaiting_joe!=null?String(C.awaiting_joe):'NO FEED'],
    ['Content scheduled per lane','X','NO FEED']];
  const col={G:'var(--green)',Y:'var(--amber)',R:'var(--red)',X:'var(--gray)'};
  const rows=K.map(k=>`<div class="r"><span class="dot" style="--c:${col[k[1]]}"></span><span class="t">${E(k[0])}</span><b style="color:${col[k[1]]}">${E(k[2])}</b></div>`).join('');
  const sum=`<div class="rows">${rows}</div>`+src(s);
  const det=`<div class="cols"><div><h4>SCORECARD</h4>${rows}<p class="src">Content per lane needs the AdaptlyPost queue, which is not connected yet, so it reads NO FEED.</p></div>
    <div><h4>WEBSITES · LIVE HTTPS CHECK</h4><table><tr><th>Site</th><th>Status</th><th>Response</th></tr>${D.sitesL.map(x=>`<tr><td><a href="https://${E(x.host)}" target="_blank" rel="noopener">${E(x.host)}</a></td><td style="color:${x.up?'var(--green)':'var(--red)'}">${x.up?'UP':'DOWN'} ${x.status||''}</td><td>${x.ms??'–'} ms</td></tr>`).join('')}</table>
    <p class="src">Checked ${sites.data?CC.ago(sites.data.checked_at):'never'} · rechecked every 10 min when the board loads</p></div></div>`+src(s);
  return[s,sum,det];},
biz(){const s=D.biz;if(!s.data)return[s,nofeed('Business rollup not pushed yet'),nofeed('')];
  const COL={site_ok:'var(--green)',needs_joe:'var(--fuchsia)',waiting:'var(--amber)',building:'var(--azure)',backlog:'var(--blue)',no_feed:'var(--gray)',down:'var(--red)'};
  const LAB={site_ok:'SITE UP',needs_joe:'NEEDS JOE',waiting:'WAITING',building:'IN MOTION',backlog:'BACKLOG',no_feed:'NO FEED',down:'SITE DOWN'};
  const sum=`<div class="rows">${D.tiles.map(b=>`<div class="r"><span class="dot" style="--c:${COL[b.status]}"></span><span class="t">${E(b.name)}</span><span class="chip" style="border-color:${COL[b.status]};color:${COL[b.status]}">${LAB[b.status]}</span></div>`).join('')}</div>`+src(s);
  const P=D.projects.data?D.projects.data.projects:[];
  const det=`<div class="rows"><table><tr><th>Business</th><th>Status</th><th>Sites</th><th>Projects</th></tr>${D.tiles.map(b=>`<tr><td><b>${E(b.name)}</b></td><td style="color:${COL[b.status]}">${LAB[b.status]}<br><span class="m">${E(b.line)}</span></td><td>${b.site_total?b.site_up+'/'+b.site_total+' up':'–'}${b.down.length?'<br><span style="color:var(--red)">'+E(b.down.join(', '))+'</span>':''}</td>
     <td>${P.filter(p=>p.business===b.name&&p.stage!=='Done').map(p=>`<div><span class="chip ${p.stage==='Building'?'azure':p.stage==='Waiting'?'amber':''}">${E(p.stage)}</span> ${E(p.name)} <span class="m">· ${E(p.owner)} · next: ${E(p.next)}</span></div>`).join('')||'<span class="m">none tracked</span>'}</td></tr>`).join('')}</table>
     <p class="src"><a href="${BOARD.links.projects}" target="_blank" rel="noopener">Open Projects tracker ↗</a> · ${E(D.projects.source||'')} · as of ${E(D.projects.data?D.projects.data.as_of:'')}</p></div>`+src(s);
  return[s,sum,det];},
ideas(){const I=F.ideas;const s={state:I?'live':'nofeed',source:'IdeaQ approval board (live database)',updated_at:I&&I.updated_at};
  if(!I)return[s,nofeed('IdeaQ offline'),nofeed('')];
  const sum=`<div class="stats"><div class="stat" style="--c:var(--fuchsia)"><b>${I.awaiting}</b><span>Awaiting Joe</span></div><div class="stat" style="--c:var(--azure)"><b>${I.motion}</b><span>In motion</span></div><div class="stat" style="--c:var(--green)"><b>${I.done}</b><span>Done</span></div></div>
   <div class="rows">${(I.awaiting_list||[]).slice(0,4).map(x=>`<div class="r"><span class="dot" style="--c:var(--fuchsia)"></span><span class="t">${E(x.title)}</span>${ageChip(CC.days(x.since))}</div>`).join('')}</div>`+`<div class="src">Source: IdeaQ live · last tap ${I.updated_at?CC.ago(I.updated_at):'–'}</div>`;
  const dec=(I.recent_decisions||[]).filter(x=>x.decision!=='undo');
  const det=`<div class="stats" style="grid-template-columns:repeat(5,1fr)"><div class="stat" style="--c:var(--fuchsia)"><b>${I.awaiting}</b><span>Awaiting</span></div><div class="stat" style="--c:var(--azure)"><b>${I.motion}</b><span>In motion</span></div><div class="stat" style="--c:var(--green)"><b>${I.done}</b><span>Done</span></div><div class="stat" style="--c:var(--red)"><b>${I.rejected}</b><span>Rejected</span></div><div class="stat"><b>${I.total}</b><span>Total</span></div></div>
   <div class="cols"><div><h4>AWAITING YOUR TAP</h4>${(I.awaiting_list||[]).map(x=>`<div class="r"><span class="t">${E(x.title)}</span>${ageChip(CC.days(x.since))}</div>`).join('')}<p class="src"><a href="${BOARD.links.ideaq}" target="_blank" rel="noopener">Open the IdeaQ approval board ↗</a></p></div>
   <div><h4>RECENT DECISIONS</h4>${dec.slice(0,12).map(x=>`<div class="r"><span class="chip ${x.decision==='implement'?'green':x.decision==='reject'?'red':'azure'}">${E(x.decision)}</span><span class="t">${E(x.title)}</span><span class="m">${CC.ago(x.at)}</span></div>`).join('')||'<span class="m">None yet</span>'}</div></div>`;
  return[s,sum,det];},
proflow(){const s=CC.snap(F,'proflow');if(!s.data)return[s,nofeed('ProFlow is not connected yet. Outbound e-cards, texts and emails will show here once it is.'),nofeed('ProFlow is not connected yet. Outbound e-cards, texts and emails will show here once it is. Any agent can push a “proflow” section to the feed.')];
  const d=s.data;return[s,`<pre class="mono">${E(JSON.stringify(d).slice(0,300))}</pre>`+src(s),`<pre class="mono">${E(JSON.stringify(d,null,1))}</pre>`+src(s)];}
};

/* ===== rendering ===== */
function renderPartners(){
  $('partners').innerHTML=BOARD.partners.map(p=>{const t=teamOf(p),act=t.filter(r=>r.state!=='quiet').length,wk=t.filter(r=>r.state==='working').length,f=t.length?act/t.length:0;
    return `<div class="partner" style="--pc:${p.color};--rock:${p.rock}" data-p="${p.key}" title="Click to address ${p.name} in the command bar">
      <div class="orb ${wk?'busy':''}"><img src="${p.img}" alt="${p.name}"><span class="rock"></span></div>
      <div class="who"><div class="nm">${p.name.toUpperCase()}</div><div class="role">${p.role}</div>
       <div class="team">${t.map(r=>`<span class="dotname" title="${E(r.doing||'')}"><i style="--c:${SC[r.state]}"></i>${E(r.name)}</span>`).join('')||'<span class="dotname">team NO FEED</span>'}</div></div>
      <div class="util" style="--uc:${t.length?utilColor(f):'var(--gray)'}"><div class="pct">${t.length?Math.round(f*100)+'%':'–'}</div><small>${act}/${t.length} active · ${wk} now</small></div></div>`;}).join('');
  document.querySelectorAll('.partner').forEach(el=>el.onclick=()=>{const p=BOARD.partners.find(x=>x.key===el.dataset.p);$('cmdin').value=p.name+', ';$('cmdin').focus();});
}
function renderBoard(){
  $('board').innerHTML=BOARD.sections.map(c=>{let out;try{out=R[c.id]()}catch(e){console.error(c.id,e);out=[{state:'nofeed'},nofeed('render error'),'']}
    return `<div class="sec" data-id="${c.id}" style="--sc:${c.color}"><h3>${c.title}${tagOf(out[0])}</h3>${out[1]}</div>`;}).join('');
  document.querySelectorAll('#board .sec').forEach(el=>el.onclick=()=>expand(el.dataset.id));
  if(XP)expand(XP,true);
}
function expand(id,quiet){const c=BOARD.sections.find(x=>x.id===id);if(!c)return;XP=id;const out=R[id]();
  $('xp').innerHTML=`<div class="sec" style="--sc:${c.color}"><button class="close" onclick="collapse()">✕ Esc</button><h3>${c.title}${tagOf(out[0])}</h3>${out[2]}</div>`;
  $('xp').classList.add('on');$('scrim').classList.add('on');}
function collapse(){XP=null;$('xp').classList.remove('on');$('scrim').classList.remove('on');}
$('scrim').onclick=collapse;addEventListener('keydown',e=>{if(e.key==='Escape'){collapse();hideOut();}});
function render(){D=CC.derive(F);renderPartners();renderBoard();
  const st=D.staleList.length?'stale':'live';
  $('feedpill').className='pill '+st;$('feedpill').innerHTML='feed <b>'+(st==='live'?'LIVE '+D.freshN+'/'+D.fresh.length:'STALE: '+E(D.staleList.join(', ').replace(/_/g,' ')))+'</b>';
  $('updpill').innerHTML='updated <b>'+CC.time(F.generated_at)+' PT</b>';
  $('banner').className=st==='stale'?'stale':'';$('banner').textContent=st==='stale'?'STALE DATA':'';
  document.body.dataset.ready='1';}
async function pull(force){
  $('refresh').textContent='↻ …';
  try{F=await CC.load(force?'&sites=now':'');LASTOK=Date.now();$('setup').style.display='none';render();}
  catch(e){if(e.code==='nokey'||e.code==='badkey'){$('setup').style.display='flex';$('setupmsg').textContent=e.code==='badkey'?'This link\'s key was rejected. Ask Benjamin for the current link.':'Open the Boardroom with its private link (it ends in #k=…).';}
    else{$('feedpill').className='pill err';$('feedpill').innerHTML='feed <b>OFFLINE · '+E(e.message)+'</b>';$('banner').className='err';$('banner').textContent='FEED OFFLINE'+(LASTOK?' · showing data from '+CC.ago(new Date(LASTOK).toISOString()):'');}
    document.body.dataset.ready=F?'1':'err';}
  finally{$('refresh').textContent='↻ Refresh';}
}
$('refresh').onclick=()=>pull(true);
/* keep the key in the TV link so it opens straight away */
const k=CC.key();if(k)$('tvlink').href='../tv/#k='+encodeURIComponent(k);

/* ===== command bar ===== */
const AGENTS=()=> (D&&D.roster.length?D.roster.map(r=>r.name):['Donna','Louis','Nigel','Benjamin','Iris','Rachel','Elena','Data','Katrina','Codex','Cody','Gene']);
const OPEN={util:'util',team:'util',desk:'desk',joe:'desk',held:'desk',sales:'sales',relay:'relay',kpi:'score',score:'score',scorecard:'score',biz:'biz',business:'biz',businesses:'biz',ideas:'ideas',ideaq:'ideas',proflow:'proflow'};
function showOut(html){$('cmdout').innerHTML=`<div class="card">${html}<div style="margin-top:8px;text-align:right"><button onclick="hideOut()">Close</button></div></div>`;$('cmdout').classList.add('on');}
function hideOut(){$('cmdout').classList.remove('on');}
function runCmd(raw){const q=raw.trim();if(!q)return;const ql=q.toLowerCase();
  if(/^(help|\?)$/.test(ql))return showOut(`<b>Commands</b><pre>refresh            pull the feed now
open relay | ideas | desk | sales | kpi | biz | util | proflow
tv                 open the TV board
ideaq              open the IdeaQ approval board
projects           open the Open Projects tracker
Donna, &lt;task&gt;      draft a task for a partner or agent (also @Nigel …)</pre><span class="m">Messages are drafted for you to copy and post. The board never posts to Slack by itself.</span>`);
  if(/^(refresh|reload|update)$/.test(ql)){hideOut();return pull(true);}
  if(ql==='tv')return window.open($('tvlink').href,'_blank');
  if(ql==='ideaq')return window.open(BOARD.links.ideaq,'_blank');
  if(ql==='projects')return window.open(BOARD.links.projects,'_blank');
  let m=ql.match(/^(open|show)\s+(\w+)/);if(m&&OPEN[m[2]]){hideOut();return expand(OPEN[m[2]]);}
  m=q.match(/^@?([A-Za-z]+)[,:]?\s+(.+)$/);
  const who=m&&AGENTS().find(a=>a.toLowerCase()===m[1].toLowerCase());
  if(who){const msg=`${who}: ${m[2].trim()}\n— Joe (from the Boardroom, ${CC.time(null,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} PT)`;
    window._draft=msg;
    return showOut(`<b>Draft for ${E(who)}</b> <span class="m">· not sent</span><pre>${E(msg)}</pre><button onclick="navigator.clipboard.writeText(window._draft).then(()=>this.textContent='Copied ✓')">Copy</button> <a class="btn" href="${BOARD.links.slack}" target="_blank" rel="noopener">Open #executive-control-tower ↗</a>`);}
  showOut(`Not sure what “${E(q)}” means. Type <b>help</b>, or start with a name: “Nigel, check the Relay”.`);
}
$('cmdgo').onclick=()=>{runCmd($('cmdin').value);};
$('cmdin').addEventListener('keydown',e=>{if(e.key==='Enter'){runCmd($('cmdin').value);}});

function tick(){$('clock').textContent=CC.clock();$('date').textContent=CC.time(null,{weekday:'short',month:'short',day:'numeric'})+' · PT';}
tick();setInterval(tick,1000);pull(false);setInterval(()=>pull(false),BOARD.refreshMs);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LASTOK&&Date.now()-LASTOK>BOARD.refreshMs)pull(false);});
</script>
</body></html>
