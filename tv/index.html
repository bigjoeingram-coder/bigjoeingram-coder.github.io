<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Ingram Command · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--u:max(0.4px,min(calc(100vw / 1920),calc(100vh / 1080)));--bg:#020409;--fuchsia:#ff2bd6;--green:#2ee59d;--amber:#ffb020;--red:#ff3b4e;--yellow:#ffd84a;--azure:#36c8ff;--blue:#2f8cff;--chrome:#e8eef6;--dim:#8a97ab;--gray:#5d6676}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--chrome);font-family:'Barlow Semi Condensed',system-ui,sans-serif}
body{background:radial-gradient(calc(1200*var(--u)) calc(500*var(--u)) at 20% -10%,rgba(255,59,78,.12),transparent 60%),radial-gradient(calc(900*var(--u)) calc(500*var(--u)) at 70% -10%,rgba(46,229,157,.08),transparent 60%),var(--bg)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(47,140,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,255,.04) 1px,transparent 1px);background-size:calc(48*var(--u)) calc(48*var(--u));pointer-events:none}
#wrap{position:absolute;inset:0;padding:calc(16*var(--u)) calc(22*var(--u)) calc(8*var(--u));display:flex;flex-direction:column;gap:calc(12*var(--u));transition:transform 2s}
#top{display:flex;align-items:center;gap:calc(22*var(--u));height:calc(86*var(--u));flex:none}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:calc(28*var(--u));letter-spacing:calc(2*var(--u));background:linear-gradient(180deg,#fff,#9fb3cc 55%,#e8eef6);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#clock{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(52*var(--u));color:#fff;line-height:1;margin-left:calc(8*var(--u))}
#date{font-size:calc(28*var(--u));color:var(--dim);margin-left:calc(14*var(--u))}
#banner{margin-left:auto;padding:calc(6*var(--u)) calc(18*var(--u));border-radius:calc(10*var(--u));font-size:calc(28*var(--u));font-weight:800;letter-spacing:calc(1.5*var(--u));display:none;max-width:calc(640*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner.stale{display:block;background:rgba(255,176,32,.16);border:calc(2*var(--u)) solid var(--amber);color:var(--amber)}
#banner.err{display:block;background:rgba(255,59,78,.18);border:calc(2*var(--u)) solid var(--red);color:var(--red)}
#stage{flex:1;min-height:0;display:flex;gap:calc(16*var(--u))}
#cols{flex:1;min-width:0;display:grid;grid-template-columns:1.65fr 1fr 0.55fr;gap:calc(14*var(--u));min-height:0}
.col{border-radius:calc(18*var(--u));border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;padding-bottom:calc(6*var(--u))}
.col.red{background:linear-gradient(180deg,rgba(255,59,78,.16),rgba(12,4,8,.92) 28%);border-color:rgba(255,59,78,.4)}
.col.work{background:linear-gradient(180deg,rgba(54,200,255,.14),rgba(4,10,18,.92) 28%);border-color:rgba(54,200,255,.35)}
.col.green{background:linear-gradient(180deg,rgba(46,229,157,.14),rgba(4,14,10,.92) 28%);border-color:rgba(46,229,157,.35)}
.hd{padding:calc(8*var(--u)) calc(18*var(--u)) calc(4*var(--u));flex:none}
.hd .kicker{font-size:calc(28*var(--u));font-weight:800;letter-spacing:calc(3*var(--u));text-transform:uppercase}
.col.red .kicker{color:var(--red)}.col.work .kicker{color:var(--azure)}.col.green .kicker{color:var(--green)}
.hd .count{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(68*var(--u));line-height:.95;color:#fff}
.hd .count small{font-family:'Barlow Semi Condensed',sans-serif;font-size:calc(28*var(--u));font-weight:700;color:var(--chrome);margin-left:calc(12*var(--u));letter-spacing:0}
.subh{font-size:calc(28*var(--u));font-weight:800;letter-spacing:1px;color:var(--dim);padding:calc(6*var(--u)) calc(18*var(--u)) calc(2*var(--u));text-transform:uppercase}
.col.red .subh.you{color:var(--fuchsia)}
.body{flex:1;min-height:0;overflow:hidden;padding:0 calc(12*var(--u)) calc(8*var(--u));display:flex;flex-direction:column}
.item{padding:calc(5*var(--u)) calc(8*var(--u));border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:1px;flex:none}
.item.one{flex-direction:row;align-items:center;gap:calc(10*var(--u));padding:calc(6*var(--u)) calc(8*var(--u))}
.item.one .nm{flex:1;min-width:0}
.item.one .meta{flex:none;margin:0}
.item .nm{font-size:calc(28*var(--u));font-weight:700;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(28*var(--u));color:var(--chrome)}
.item .who{font-weight:700;white-space:nowrap}
.item .who.joe{color:var(--fuchsia)}
.item .rest{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chip{font-family:'JetBrains Mono',monospace;font-size:calc(28*var(--u));font-weight:800;padding:0 calc(8*var(--u));border-radius:calc(8*var(--u));border:calc(2*var(--u)) solid var(--dim);color:var(--dim);white-space:nowrap;margin-left:auto}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.red{border-color:var(--red);color:var(--red);background:rgba(255,59,78,.12)}
.barwrap{display:flex;align-items:center;gap:calc(10*var(--u));margin-top:calc(2*var(--u))}
.bar{flex:1;height:calc(14*var(--u));border-radius:calc(8*var(--u));background:rgba(54,200,255,.15);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#1aa6d6,var(--green));border-radius:calc(8*var(--u))}
.bar.unk{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 calc(8*var(--u)),transparent calc(8*var(--u)) calc(16*var(--u)))}
.pct{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(36*var(--u));color:#fff;min-width:3.2ch;text-align:right}
.pct.unk{color:var(--dim);font-size:calc(28*var(--u))}
.check{display:flex;align-items:center;gap:calc(12*var(--u));padding:calc(8*var(--u)) calc(8*var(--u));border-top:1px solid rgba(255,255,255,.08)}
.check .lab{font-size:calc(28*var(--u));font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check .val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(36*var(--u));color:var(--green)}
.check.bad .val{color:var(--red)}
.check.ok .val{color:var(--green)}
.more{font-size:calc(28*var(--u));font-weight:800;color:var(--amber);padding:calc(8*var(--u)) calc(10*var(--u));letter-spacing:1px}
.empty,.nofeedbox{font-size:calc(28*var(--u));color:var(--dim);padding:calc(16*var(--u)) calc(10*var(--u));font-weight:700}

.col.green .hd{padding:calc(6*var(--u)) calc(10*var(--u)) calc(2*var(--u))}
.col.green .body{padding:0 calc(8*var(--u)) calc(6*var(--u))}
.col.green .check{padding:calc(4*var(--u)) calc(6*var(--u));gap:calc(2*var(--u))}
.col.green .item{padding:calc(4*var(--u)) calc(6*var(--u))}
.seatc{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(28*var(--u));line-height:1;padding:0 calc(7*var(--u));border-radius:calc(8*var(--u));border:calc(2*var(--u)) solid var(--azure);color:var(--azure);background:rgba(54,200,255,.12);white-space:nowrap;letter-spacing:calc(0.5*var(--u));flex:none}
.seatc.none{border-color:var(--dim);color:var(--dim);background:transparent;opacity:.8}
#codes{flex:none;font-size:calc(28*var(--u));font-weight:650;color:var(--dim);line-height:1.15;letter-spacing:calc(0.2*var(--u));padding:calc(2*var(--u)) calc(8*var(--u));white-space:normal}
#codes b{color:var(--azure);font-family:'JetBrains Mono',monospace;font-weight:800;padding-right:calc(4*var(--u))}
.ag .sig{display:flex;align-items:center;gap:calc(6*var(--u));justify-content:center}
.ag .ago{font-size:calc(28*var(--u));font-weight:650;color:var(--dim);line-height:1;white-space:nowrap}
.col.red .hd{padding-bottom:calc(2*var(--u))}

#team{width:calc(268*var(--u));flex:none;display:flex;flex-direction:column;border-radius:calc(18*var(--u));border:1px solid rgba(47,140,255,.28);background:rgba(5,10,20,.9);padding:calc(10*var(--u)) calc(10*var(--u)) calc(8*var(--u));min-height:0}
#team .kicker{font-size:calc(28*var(--u));font-weight:800;letter-spacing:calc(2*var(--u));color:var(--dim);padding:calc(2*var(--u)) calc(6*var(--u)) calc(8*var(--u))}
#roster{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,1fr);gap:calc(4*var(--u));min-height:0}
.ag{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(3*var(--u));border-radius:calc(10*var(--u));border:1px solid rgba(255,255,255,.08);background:rgba(8,16,32,.8);padding:calc(2*var(--u)) calc(4*var(--u));min-height:0}
.ag .nm{font-size:calc(28*var(--u));font-weight:800;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.ag i{width:calc(18*var(--u));height:calc(18*var(--u));border-radius:50%;background:var(--c);box-shadow:0 0 calc(10*var(--u)) var(--c);flex:none}
.ag.quiet i{box-shadow:none;opacity:.85}
.ag.quiet .nm{color:var(--dim)}
#genius-bar{flex:none;height:calc(52*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(16*var(--u));border-radius:calc(14*var(--u));border:1px solid rgba(54,200,255,.32);background:rgba(5,12,24,.94);overflow:hidden}
#genius-bar .g-brand{font-family:Orbitron,sans-serif;font-weight:900;font-size:calc(28*var(--u));letter-spacing:calc(1.5*var(--u));color:var(--azure);white-space:nowrap;flex:none}
#genius-bar .g-pill{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(28*var(--u));padding:calc(2*var(--u)) calc(12*var(--u));border-radius:calc(8*var(--u));border:calc(2*var(--u)) solid var(--dim);color:var(--chrome);background:rgba(255,255,255,.04);white-space:nowrap;flex:none;text-transform:uppercase}
#genius-bar .g-pill.listening{border-color:var(--green);color:var(--green);background:rgba(46,229,157,.14)}
#genius-bar .g-pill.transcribing{border-color:var(--azure);color:var(--azure);background:rgba(54,200,255,.14)}
#genius-bar .g-pill.sent{border-color:var(--green);color:#fff;background:rgba(46,229,157,.22)}
#genius-bar .g-pill.missed{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.14)}
#genius-bar .g-list{flex:1;min-width:0;display:flex;align-items:center;gap:calc(18*var(--u));overflow:hidden;white-space:nowrap}
#genius-bar .g-item{display:inline-flex;align-items:center;gap:calc(8*var(--u));white-space:nowrap;overflow:hidden;max-width:calc(620*var(--u));flex:none}
#genius-bar .g-tm{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:calc(28*var(--u));color:var(--dim);flex:none}
#genius-bar .g-seat{font-weight:800;font-size:calc(28*var(--u));color:var(--green);flex:none}
#genius-bar .g-txt{font-size:calc(28*var(--u));color:var(--chrome);overflow:hidden;text-overflow:ellipsis}
#genius-bar .g-sep{color:var(--gray);font-size:calc(28*var(--u));flex:none}
#genius-bar .g-empty{font-size:calc(28*var(--u));color:var(--dim);font-weight:700}
#mascot{position:relative;flex:none;height:calc(250*var(--u));margin-top:calc(4*var(--u));border-radius:calc(12*var(--u));overflow:hidden;border:1px solid rgba(46,229,157,.25);background:#000}
#mascot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;opacity:0;transition:opacity .9s ease}
#mascot img.on{opacity:1}
#mascot canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none;opacity:.22;transition:opacity .9s ease;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 20%,transparent 36%,transparent 64%,#000 80%,#000 100%);mask-image:linear-gradient(90deg,#000 0,#000 20%,transparent 36%,transparent 64%,#000 80%,#000 100%)}
#mascot[data-st="listening"] canvas{opacity:.6}
#mascot[data-st="onit"] canvas{opacity:.95}
#mascot[data-st="done"] canvas{opacity:.18}
#mascot .m-cap{position:absolute;left:0;right:0;bottom:0;padding:calc(4*var(--u)) calc(8*var(--u));font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(28*var(--u));letter-spacing:calc(2*var(--u));text-align:center;color:var(--green);background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
#mascot .m-test{position:absolute;top:calc(6*var(--u));left:calc(6*var(--u));font-family:'JetBrains Mono',monospace;font-weight:800;font-size:calc(28*var(--u));color:#000;background:var(--amber);padding:0 calc(8*var(--u));border-radius:calc(6*var(--u));display:none}
#mascot.test .m-test{display:block}
#foot{flex:none;font-family:'JetBrains Mono',monospace;font-size:calc(28*var(--u));color:var(--gray);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:calc(40*var(--u));line-height:calc(40*var(--u))}
#setup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(20*var(--u));font-size:calc(40*var(--u));background:var(--bg);z-index:9}
</style></head>
<body>
<div class="grid-bg"></div>
<div id="setup"><div style="font-family:Orbitron;font-size:calc(56*var(--u))">INGRAM COMMAND</div><div id="setupmsg">Open this board with its private link (it ends in #k=…).</div></div>
<div id="wrap">
  <div id="top">
    <div class="logo">INGRAM COMMAND</div>
    <div id="clock"></div>
    <div id="date"></div>
    <div id="banner"></div>
  </div>
  <div id="stage">
    <div id="cols">
      <div class="col red" id="col-red"></div>
      <div class="col work" id="col-work"></div>
      <div class="col green" id="col-green"></div>
    </div>
    <div id="team">
      <div class="kicker">TEAM</div>
      <div id="roster"></div>
      <div id="mascot" data-st="idle"><img id="m-idle" class="on" alt="Genius idle"><img id="m-onit" alt="Genius on it"><img id="m-done" alt="Genius done"><canvas id="m-rain" width="124" height="165"></canvas><div class="m-cap" id="m-cap">IDLE</div><div class="m-test">TEST</div></div>
    </div>
  </div>
  <div id="genius-bar"><div class="g-brand">HEY GENIUS</div><div class="g-pill" id="g-state">IDLE</div><div class="g-list" id="g-list"><span class="g-empty">Waiting for Hey Genius…</span></div></div>
  <div id="codes"><b>LO</b>Louis · <b>DO</b>Donna · <b>NI</b>Nigel · <b>BE</b>Benjamin · <b>IR</b>Iris · <b>RA</b>Rachel · <b>EL</b>Elena · <b>KA</b>Katrina · <b>CX</b>Codex · <b>CY</b>Cody · <b>GE</b>Gene</div>
    <div id="foot"></div>
</div>
<!-- test hooks: counts stay in the DOM even though the old KPI strip is gone -->
<div style="position:absolute;left:-9999px;top:auto" aria-hidden="true">
  <span id="v-needs"></span><span id="v-blocked"></span><span id="v-agents"></span><span id="v-sites"></span><span id="v-feed"></span>
</div>
<script src="../common.js"></script>
<script src="../assets/genius-poses.js"></script>
<script>
const $=id=>document.getElementById(id), E=CC.esc;
const ST={working:'var(--green)',idle:'var(--yellow)',quiet:'var(--red)'};
const SEAT={Louis:'LO',Donna:'DO',Nigel:'NI',Benjamin:'BE',Iris:'IR',Rachel:'RA',Elena:'EL',Data:'DA',Katrina:'KA',Codex:'CX',Cody:'CY',Gene:'GE'};
function shortAgo(iso){
  if(!iso) return '—';
  const s=(Date.now()-new Date(iso))/1000;
  if(s<90) return 'now';
  if(s<3600) return Math.max(1,Math.round(s/60))+'m';
  if(s<48*3600) return Math.max(1,Math.round(s/3600))+'h';
  return Math.max(1,Math.round(s/86400))+'d';
}
function seatCode(x){
  const c=(x&&x.contact)||'';
  if(SEAT[c]) return SEAT[c];
  if(x&&x.code&&/^[A-Z]{2}$/.test(x.code)) return x.code;
  return '';
}

let LAST=null, LASTOK=0, FAILS=0;

function tick(){$('clock').textContent=CC.clock();$('date').textContent=CC.date();
  if(LASTOK&&Date.now()-LASTOK>5*60e3){showBanner('err','FEED OFFLINE · LAST GOOD '+CC.ago(new Date(LASTOK).toISOString()).toUpperCase());}}
function showBanner(cls,txt){const b=$('banner');b.className=cls||'';b.textContent=txt||'';}

function rows(arr, extraCls){
  return (arr||[]).map(x=>{
    const d=CC.crmDays(x.since);
    const joe=/^joe$/i.test(x.next||'');
    return `<div class="item ${extraCls||''}" data-name="${E(x.name)}">
      <div class="nm">${E(x.name)}</div>
      <div class="meta"><span class="who ${joe?'joe':''}">${E(x.next||'—')}</span>
        ${x.detail?`<span class="rest">${E(x.detail)}</span>`:''}${CC.dayChip(d)}</div>
    </div>`;
  }).join('');
}
function fillVisible(el, htmlItems){
  /* pack as many 28px rows as will fit; leftover becomes "+N more" */
  el.innerHTML=htmlItems.join('')+'<div class="more" style="display:none"></div>';
  const more=el.lastElementChild;
  const kids=[...el.children].filter(c=>c!==more);
  let hidden=0;
  const fits=()=>el.scrollHeight<=el.clientHeight;
  for(let i=kids.length-1;i>=1;i--){ /* keep at least one item when possible */
    if(fits()) break;
    kids[i].style.display='none'; hidden++;
  }
  if(hidden){
    more.style.display='block'; more.textContent='+'+hidden+' more';
    for(let i=kids.length-hidden-1;i>=1 && !fits();i--){ kids[i].style.display='none'; hidden++; more.textContent='+'+hidden+' more'; }
  }
}

function render(f){
  const D=CC.derive(f), A=D.action.data||{}, I=f.ideas||{}, C=f.content||{}, Sa=f.sales||{}, Ph=f.phone||{};
  // Needs Joe + live queues (IdeaQ / content cards) that only Joe can clear
  let needs=(A.needs_joe||[]).slice();
  if(I.awaiting>0){
    const oldest=(I.awaiting_list||[]).map(x=>x.since).filter(Boolean).sort()[0]||null;
    if(!needs.some(n=>/idea.?q|idea queue/i.test(n.name)&&/awaiting your tap|cards awaiting/i.test(n.name)))
      needs.push({name:I.awaiting+' IdeaQ cards awaiting your tap', next:'Joe', contact:'Benjamin', code:'BE', since:oldest, src:'IdeaQ live', detail:null});
  }
  if(C.awaiting_joe>0){
    needs.push({name:C.awaiting_joe+' content cards awaiting you', next:'Joe', contact:'Elena', code:'EL', since:null, src:'Content board', detail:null});
  }
  needs.sort((a,b)=>((a.since||'9999').localeCompare(b.since||'9999')));
  const push=(A.joe_to_push||[]).slice().sort((a,b)=>((a.since||'9999').localeCompare(b.since||'9999')));
  const work=A.working||[];
  const wins=A.wins||[];

  const needN=needs.length, pushN=push.length, redN=needN+pushN;
  const one=x=>{
    const d=CC.crmDays(x.since); const code=seatCode(x);
    return `<div class="item one"><div class="nm">${E(x.name)}</div>
      <div class="meta">${CC.dayChip(d)}${code?`<span class="seatc" title="${E(x.contact||'')}">${E(code)}</span>`:`<span class="seatc none">—</span>`}</div></div>`;
  };
  $('col-red').innerHTML=`
    <div class="hd"><div class="kicker">Red</div>
      <div class="count">${D.action.state==='nofeed'&&!needN?'–':redN}<small id="red-sub">${needN} need you · ${pushN} to push</small></div></div>
    <div class="subh you">Needs Joe</div>
    <div class="body" id="red-needs" style="flex:2"></div>
    <div class="subh">Joe to push</div>
    <div class="body" id="red-push" style="flex:1"></div>`;
  if(!D.action.data && !needN){
    $('red-needs').innerHTML='<div class="nofeedbox">NO FEED</div>';
    $('red-push').innerHTML='';
  }else{
    fillVisible($('red-needs'), needs.map(one));
    fillVisible($('red-push'), push.length?push.map(one):['<div class="empty">Nothing to push</div>']);
  }

  $('col-work').innerHTML=`
    <div class="hd"><div class="kicker">Working</div>
      <div class="count">${D.action.state==='nofeed'&&!work.length?'–':work.length}<small>in motion</small></div></div>
    <div class="body" id="work-body"></div>`;
  const workHtml=D.action.state==='nofeed'&&!work.length?['<div class="nofeedbox">NO FEED</div>']:work.map(x=>{
    const d=CC.crmDays(x.since), known=x.pct!=null&&x.pct!=='';
    return `<div class="item">
      <div class="nm">${E(x.name)}</div>
      <div class="barwrap"><div class="bar ${known?'':'unk'}">${known?`<i style="width:${Math.max(0,Math.min(100,+x.pct))}%"></i>`:''}</div>
        <div class="pct ${known?'':'unk'}">${known?Math.round(+x.pct)+'%':'?%'}</div></div>
      <div class="meta"><span class="who">${E(x.next||'—')}</span>${x.detail?`<span class="rest">${E(x.detail)}</span>`:''}${CC.dayChip(d)}</div>
    </div>`;
  });
  fillVisible($('work-body'), workHtml);

  const down=(D.sitesL||[]).filter(s=>!s.up);
  const checks=[];
  if(D.sites.data){
    checks.push({lab:'Websites', val:D.sitesUp+'/'+D.sitesTotal, bad:down.length, detail:down.length?down.map(s=>s.host).join(', '):'all up'});
  }else checks.push({lab:'Websites', val:'NO FEED', bad:true});
  if(D.fresh.length){
    checks.push({lab:'Feed health', val:D.freshN+'/'+D.fresh.length, bad:D.freshN<D.fresh.length, detail:D.staleList.length?'stale: '+D.staleList.join(', ').replace(/_/g,' '):'fresh'});
  }
  const ghtml=[
    ...checks.map(c=>`<div class="check ${c.bad?'bad':'ok'}"><div class="lab">${E(c.lab)}${c.detail?` <span style="color:var(--dim);font-weight:600">· ${E(c.detail)}</span>`:''}</div><div class="val">${E(c.val)}</div></div>`),
    wins.length?`<div class="subh" style="color:var(--green)">Finished / went live · last 24h</div>`:'',
    ...wins.map(x=>rows([x],'win'))
  ].filter(Boolean);
  if(!wins.length) ghtml.push('<div class="empty">No projects finished in the last 24 hours</div>');
  $('col-green').innerHTML=`
    <div class="hd"><div class="kicker">Green</div>
      <div class="count">${checks.filter(c=>!c.bad).length+wins.length}<small>healthy${wins.length?' + '+wins.length+' new':''}</small></div></div>
    <div class="body" id="green-body"></div>`;
  fillVisible($('green-body'), ghtml);

  /* team strip: two wide, dot under the name, last seen under the dot. green=3h, yellow=36h, red=older */
  const roster=D.agents.data?D.roster:[];
  $('roster').innerHTML=D.agents.data?roster.map(r=>`<div class="ag ${r.state}" style="--c:${ST[r.state]}" title="${E((r.doing||'')+(r.src?' · '+r.src:''))}">
    <div class="nm">${E(r.name)}</div><div class="sig"><i></i><div class="ago">${E(shortAgo(r.last_at))}</div></div></div>`).join('')
    :'<div class="ag quiet" style="--c:var(--gray);grid-column:1/-1"><div class="nm">NO FEED</div><i></i></div>';

  /* Hey Genius live strip */
  const gSnap=f.snapshots&&f.snapshots.genius&&f.snapshots.genius.data;
  const gStEl=$('g-state'), gListEl=$('g-list');
  if(!gSnap){
    gStEl.className='g-pill'; gStEl.textContent='NO FEED';
    gListEl.innerHTML='<span class="g-empty">PC listener offline or not yet synced</span>';
  }else{
    const stRaw=String(gSnap.state||'Idle');
    const stLow=stRaw.toLowerCase();
    let cls='g-pill';
    if(stLow.includes('listen')) cls+=' listening';
    else if(stLow.includes('transcrib')) cls+=' transcribing';
    else if(stLow.includes('sent')) cls+=' sent';
    else if(stLow.includes('miss')) cls+=' missed';
    gStEl.className=cls;
    gStEl.textContent=stRaw.toUpperCase();
    const items=(gSnap.dispatches||[]).slice(0,3);
    const shortPt=t=>{const m=String(t||'').match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2}):\d{2}\s*(\w+)?/);if(!m)return String(t||'');let h=+m[2];const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m[3]} ${ap} ${m[4]||'PT'}`;};
    gListEl.innerHTML=items.length?items.map((x,idx)=>{
      const snip=String(x.text||'').replace(/\s+/g,' ').trim();
      const shortTxt=snip.length>38?snip.slice(0,37)+'…':snip;
      return `${idx?'<span class="g-sep">·</span>':''}<span class="g-item"><span class="g-tm">${E(shortPt(x.time_pt))}</span><span class="g-seat">${E(x.seat||'Benjamin')}</span><span class="g-txt">${E(shortTxt)}</span></span>`;
    }).join(''):'<span class="g-empty">No dispatches yet today</span>';
  }

  /* Matrix Einstein mascot follows the genius feed */
  if(window.GM) GM.feed(gSnap);

  /* test hooks + stale */
  $('v-needs').textContent=needN;
  $('v-blocked').textContent=pushN;
  $('v-agents').textContent=D.agents.data?D.working:'–';
  $('v-sites').textContent=D.sitesTotal?D.sitesUp+'/'+D.sitesTotal:'–';
  $('v-feed').textContent=D.freshN+'/'+D.fresh.length;
  if(D.staleList.length) showBanner('stale','STALE DATA · '+D.staleList.join(' · ').replace(/_/g,' ').toUpperCase()); else showBanner('','');
  $('foot').textContent='Updated '+CC.time(f.generated_at,{hour:'numeric',minute:'2-digit',second:'2-digit'})+' PT · refresh 10s · Relay row '+(D.relay.data&&D.relay.data.tail_row||'–')+' · ? = no recorded date or % · day 0 = today';
  document.body.dataset.ready='1';
}

async function pull(){
  try{const f=await CC.load();LAST=f;LASTOK=Date.now();FAILS=0;$('setup').style.display='none';render(f);}
  catch(e){FAILS++;
    if(e.code==="nokey"||e.code==="badkey"){$("setup").style.display="flex";$("setupmsg").textContent=e.code==="badkey"?"This link's key was rejected. Ask Benjamin for the current TV link.":"Open this board with its private link (it ends in #k=...).";}
    else if(!LAST) showBanner('err','CONNECTING TO FEED… ('+e.message+')');
    document.body.dataset.ready='err';}
  try{if(window.keepAwake) window.keepAwake();}catch(e){}
}
/* Matrix Einstein: figure never moves, poses crossfade, code rain is a tiny canvas (low fps). */
const GM=window.GM=(function(){
  const P=window.GENIUS_POSES||{}, box=$('mascot'), cap=$('m-cap'), cv=$('m-rain'), cx=cv.getContext('2d');
  ['idle','onit','done'].forEach(n=>{if(P[n])$('m-'+n).src=P[n];});
  const q=new URLSearchParams(location.search), forced=(q.get('genius_test')||'').toLowerCase();
  const TESTS={idle:1,listening:1,onit:1,done:1};
  let st='', doneUntil=0, lastTop=null, seen=false;
  const FPS={idle:5,listening:12,onit:20,done:5}, DENS={idle:.25,listening:.6,onit:1,done:.2};
  const fs=10, cols=Math.floor(cv.width/fs), drops=Array.from({length:cols},()=>Math.random()*-20);
  const G='アカサタナハマヤラワ0123456789ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘ';
  let timer=null;
  function frame(){
    cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,0,cv.width,cv.height);
    cx.font=fs+'px monospace';const d=DENS[st]||.25;
    for(let i=0;i<cols;i++){
      if(drops[i]<0||Math.random()<d){
        const y=drops[i]*fs;if(y>0){cx.fillStyle=Math.random()<.1?'#c8ffd9':'#2ee59d';cx.fillText(G[(Math.random()*G.length)|0],i*fs,y);}
      }
      drops[i]+=1; if(drops[i]*fs>cv.height&&Math.random()>.95-d*.1) drops[i]=Math.random()*-10;
    }
  }
  function set(s){
    if(s===st) return; st=s; box.dataset.st=s;
    const pose=s==='onit'?'onit':s==='done'?'done':'idle';
    ['idle','onit','done'].forEach(n=>$('m-'+n).classList.toggle('on',n===pose));
    cap.textContent={idle:'IDLE',listening:'LISTENING',onit:'ON IT',done:'DONE'}[s];
    clearInterval(timer); timer=setInterval(frame,1000/(FPS[s]||5));
  }
  function feed(g){
    if(forced&&TESTS[forced]){box.classList.add('test');set(forced);return;}
    const now=Date.now(), stRaw=String(g&&g.state||'Idle').toLowerCase();
    const top=g&&g.dispatches&&g.dispatches[0]?(g.dispatches[0].time_pt+'|'+g.dispatches[0].text):null;
    if(seen&&top&&top!==lastTop) doneUntil=now+6000;   /* new dispatch since last poll */
    lastTop=top; seen=true;
    if(stRaw.startsWith('sent')&&doneUntil<now-6000) doneUntil=now+6000;
    let s='idle';
    if(stRaw.includes('listen')) s='listening';
    else if(stRaw.includes('transcrib')) s='onit';
    if(now<doneUntil) s='done';
    set(s);
    if(s==='done') setTimeout(()=>{if(Date.now()>=doneUntil&&!forced) set('idle');},doneUntil-now+50);
  }
  set(forced&&TESTS[forced]?forced:'idle'); if(forced&&TESTS[forced]) box.classList.add('test');
  return {feed,set};
})();
