<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=1920"><link rel="icon" href="data:,">
<title>Ingram Command · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020409;--fuchsia:#ff2bd6;--green:#2ee59d;--amber:#ffb020;--red:#ff3b4e;--yellow:#ffd84a;--azure:#36c8ff;--blue:#2f8cff;--chrome:#e8eef6;--dim:#8a97ab;--gray:#5d6676}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--chrome);font-family:'Barlow Semi Condensed',system-ui,sans-serif}
body{background:radial-gradient(1200px 500px at 20% -10%,rgba(255,59,78,.12),transparent 60%),radial-gradient(900px 500px at 70% -10%,rgba(46,229,157,.08),transparent 60%),var(--bg)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(47,140,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,255,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
#wrap{position:absolute;inset:0;padding:16px 22px 8px;display:flex;flex-direction:column;gap:12px;transition:transform 2s}
#top{display:flex;align-items:center;gap:22px;height:86px;flex:none}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:28px;letter-spacing:2px;background:linear-gradient(180deg,#fff,#9fb3cc 55%,#e8eef6);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#clock{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:52px;color:#fff;line-height:1;margin-left:8px}
#date{font-size:28px;color:var(--dim);margin-left:14px}
#banner{margin-left:auto;padding:6px 18px;border-radius:10px;font-size:28px;font-weight:800;letter-spacing:1.5px;display:none;max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner.stale{display:block;background:rgba(255,176,32,.16);border:2px solid var(--amber);color:var(--amber)}
#banner.err{display:block;background:rgba(255,59,78,.18);border:2px solid var(--red);color:var(--red)}
#stage{flex:1;min-height:0;display:flex;gap:16px}
#cols{flex:1;min-width:0;display:grid;grid-template-columns:1.15fr 1fr 0.95fr;gap:16px;min-height:0}
.col{border-radius:18px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;padding-bottom:6px}
.col.red{background:linear-gradient(180deg,rgba(255,59,78,.16),rgba(12,4,8,.92) 28%);border-color:rgba(255,59,78,.4)}
.col.work{background:linear-gradient(180deg,rgba(54,200,255,.14),rgba(4,10,18,.92) 28%);border-color:rgba(54,200,255,.35)}
.col.green{background:linear-gradient(180deg,rgba(46,229,157,.14),rgba(4,14,10,.92) 28%);border-color:rgba(46,229,157,.35)}
.hd{padding:8px 18px 4px;flex:none}
.hd .kicker{font-size:28px;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.col.red .kicker{color:var(--red)}.col.work .kicker{color:var(--azure)}.col.green .kicker{color:var(--green)}
.hd .count{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:68px;line-height:.95;color:#fff}
.hd .count small{font-family:'Barlow Semi Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--chrome);margin-left:12px;letter-spacing:0}
.subh{font-size:28px;font-weight:800;letter-spacing:1px;color:var(--dim);padding:6px 18px 2px;text-transform:uppercase}
.col.red .subh.you{color:var(--fuchsia)}
.body{flex:1;min-height:0;overflow:hidden;padding:0 12px 8px;display:flex;flex-direction:column}
.item{padding:5px 8px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:1px;flex:none}
.item.one{flex-direction:row;align-items:center;gap:10px;padding:6px 8px}
.item.one .nm{flex:1;min-width:0}
.item.one .meta{flex:none;margin:0}
.item .nm{font-size:28px;font-weight:700;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;align-items:center;gap:10px;font-size:28px;color:var(--chrome)}
.item .who{font-weight:700;white-space:nowrap}
.item .who.joe{color:var(--fuchsia)}
.item .rest{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chip{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;padding:0 8px;border-radius:8px;border:2px solid var(--dim);color:var(--dim);white-space:nowrap;margin-left:auto}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.red{border-color:var(--red);color:var(--red);background:rgba(255,59,78,.12)}
.barwrap{display:flex;align-items:center;gap:10px;margin-top:2px}
.bar{flex:1;height:14px;border-radius:8px;background:rgba(54,200,255,.15);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#1aa6d6,var(--green));border-radius:8px}
.bar.unk{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px)}
.pct{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:36px;color:#fff;min-width:3.2ch;text-align:right}
.pct.unk{color:var(--dim);font-size:28px}
.check{display:flex;align-items:center;gap:12px;padding:8px 8px;border-top:1px solid rgba(255,255,255,.08)}
.check .lab{font-size:28px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check .val{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:36px;color:var(--green)}
.check.bad .val{color:var(--red)}
.check.ok .val{color:var(--green)}
.more{font-size:28px;font-weight:800;color:var(--amber);padding:8px 10px;letter-spacing:1px}
.empty,.nofeedbox{font-size:28px;color:var(--dim);padding:16px 10px;font-weight:700}
#team{width:268px;flex:none;display:flex;flex-direction:column;border-radius:18px;border:1px solid rgba(47,140,255,.28);background:rgba(5,10,20,.9);padding:10px 10px 8px;min-height:0}
#team .kicker{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--dim);padding:2px 6px 8px}
#roster{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,1fr);gap:6px;min-height:0}
.ag{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(8,16,32,.8);padding:4px 4px}
.ag .nm{font-size:28px;font-weight:800;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.ag i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.ag.quiet i{box-shadow:none;opacity:.85}
.ag.quiet .nm{color:var(--dim)}
#genius-bar{flex:none;height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:14px;border:1px solid rgba(54,200,255,.32);background:rgba(5,12,24,.94);overflow:hidden}
#genius-bar .g-brand{font-family:Orbitron,sans-serif;font-weight:900;font-size:28px;letter-spacing:1.5px;color:var(--azure);white-space:nowrap;flex:none}
#genius-bar .g-pill{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;padding:2px 12px;border-radius:8px;border:2px solid var(--dim);color:var(--chrome);background:rgba(255,255,255,.04);white-space:nowrap;flex:none;text-transform:uppercase}
#genius-bar .g-pill.listening{border-color:var(--green);color:var(--green);background:rgba(46,229,157,.14)}
#genius-bar .g-pill.transcribing{border-color:var(--azure);color:var(--azure);background:rgba(54,200,255,.14)}
#genius-bar .g-pill.sent{border-color:var(--green);color:#fff;background:rgba(46,229,157,.22)}
#genius-bar .g-pill.missed{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.14)}
#genius-bar .g-list{flex:1;min-width:0;display:flex;align-items:center;gap:18px;overflow:hidden;white-space:nowrap}
#genius-bar .g-item{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;max-width:620px;flex:none}
#genius-bar .g-tm{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;color:var(--dim);flex:none}
#genius-bar .g-seat{font-weight:800;font-size:28px;color:var(--green);flex:none}
#genius-bar .g-txt{font-size:28px;color:var(--chrome);overflow:hidden;text-overflow:ellipsis}
#genius-bar .g-sep{color:var(--gray);font-size:28px;flex:none}
#genius-bar .g-empty{font-size:28px;color:var(--dim);font-weight:700}
#foot{flex:none;font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--gray);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:40px;line-height:40px}
#setup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-size:40px;background:var(--bg);z-index:9}
</style></head>
<body>
<div class="grid-bg"></div>
<div id="setup"><div style="font-family:Orbitron;font-size:56px">INGRAM COMMAND</div><div id="setupmsg">Open this board with its private link (it ends in #k=…).</div></div>
<div id="wrap">
  <div id="top">
    <div class="logo">INGRAM COMMAND</div>
    <div id="clock"></div>
    <div id="date"></div>
    <div id="banner"></div>
  </div>
  <div id="stage">
    <div id="cols">
      <div class="col red" id="col-red"></div>
      <div class="col work" id="col-work"></div>
      <div class="col green" id="col-green"></div>
    </div>
    <div id="team">
      <div class="kicker">TEAM</div>
      <div id="roster"></div>
    </div>
  </div>
  <div id="genius-bar"><div class="g-brand">HEY GENIUS</div><div class="g-pill" id="g-state">IDLE</div><div class="g-list" id="g-list"><span class="g-empty">Waiting for Hey Genius…</span></div></div>
  <div id="foot"></div>
</div>
<!-- test hooks: counts stay in the DOM even though the old KPI strip is gone -->
<div style="position:absolute;left:-9999px;top:auto" aria-hidden="true">
  <span id="v-needs"></span><span id="v-blocked"></span><span id="v-agents"></span><span id="v-sites"></span><span id="v-feed"></span>
</div>
<script src="../common.js"></script>
<script>
const $=id=>document.getElementById(id), E=CC.esc;
const ST={working:'var(--green)',idle:'var(--yellow)',quiet:'var(--red)'};
let LAST=null, LASTOK=0, FAILS=0;

function tick(){$('clock').textContent=CC.clock();$('date').textContent=CC.date();
  if(LASTOK&&Date.now()-LASTOK>5*60e3){showBanner('err','FEED OFFLINE · LAST GOOD '+CC.ago(new Date(LASTOK).toISOString()).toUpperCase());}}
function showBanner(cls,txt){const b=$('banner');b.className=cls||'';b.textContent=txt||'';}

function rows(arr, extraCls){
  return (arr||[]).map(x=>{
    const d=CC.crmDays(x.since);
    const joe=/^joe$/i.test(x.next||'');
    return `<div class="item ${extraCls||''}" data-name="${E(x.name)}">
      <div class="nm">${E(x.name)}</div>
      <div class="meta"><span class="who ${joe?'joe':''}">${E(x.next||'—')}</span>
        ${x.detail?`<span class="rest">${E(x.detail)}</span>`:''}${CC.dayChip(d)}</div>
    </div>`;
  }).join('');
}
function fillVisible(el, htmlItems){
  /* pack as many 28px rows as will fit; leftover becomes "+N more" */
  el.innerHTML=htmlItems.join('')+'<div class="more" style="display:none"></div>';
  const more=el.lastElementChild;
  const kids=[...el.children].filter(c=>c!==more);
  let hidden=0;
  const fits=()=>el.scrollHeight<=el.clientHeight;
  for(let i=kids.length-1;i>=1;i--){ /* keep at least one item when possible */
    if(fits()) break;
    kids[i].style.display='none'; hidden++;
  }
  if(hidden){
    more.style.display='block'; more.textContent='+'+hidden+' more';
    for(let i=kids.length-hidden-1;i>=1 && !fits();i--){ kids[i].style.display='none'; hidden++; more.textContent='+'+hidden+' more'; }
  }
}

function render(f){
  const D=CC.derive(f), A=D.action.data||{}, I=f.ideas||{}, C=f.content||{}, Sa=f.sales||{}, Ph=f.phone||{};
  // Needs Joe + live queues (IdeaQ / content cards) that only Joe can clear
  let needs=(A.needs_joe||[]).slice();
  if(I.awaiting>0){
    const oldest=(I.awaiting_list||[]).map(x=>x.since).filter(Boolean).sort()[0]||null;
    if(!needs.some(n=>/idea.?q|idea queue/i.test(n.name)&&/awaiting your tap|cards awaiting/i.test(n.name)))
      needs.push({name:I.awaiting+' IdeaQ cards awaiting your tap', next:'Joe', since:oldest, src:'IdeaQ live', detail:null});
  }
  if(C.awaiting_joe>0){
    needs.push({name:C.awaiting_joe+' content cards awaiting you', next:'Joe', since:null, src:'Content board', detail:null});
  }
  needs.sort((a,b)=>((a.since||'9999').localeCompare(b.since||'9999')));
  const push=(A.joe_to_push||[]).slice().sort((a,b)=>((a.since||'9999').localeCompare(b.since||'9999')));
  const work=A.working||[];
  const wins=A.wins||[];

  const needN=needs.length, pushN=push.length, redN=needN+pushN;
  const one=x=>{
    const d=CC.crmDays(x.since); const joe=/^joe$/i.test(x.next||'');
    return `<div class="item one"><div class="nm">${E(x.name)}</div>
      <div class="meta"><span class="who ${joe?'joe':''}">${E(x.next||'—')}</span>${CC.dayChip(d)}</div></div>`;
  };
  $('col-red').innerHTML=`
    <div class="hd"><div class="kicker">Red</div>
      <div class="count">${D.action.state==='nofeed'&&!needN?'–':redN}<small id="red-sub">${needN} need you · ${pushN} to push</small></div></div>
    <div class="subh you">Needs Joe</div>
    <div class="body" id="red-needs" style="flex:2"></div>
    <div class="subh">Joe to push</div>
    <div class="body" id="red-push" style="flex:1"></div>`;
  if(!D.action.data && !needN){
    $('red-needs').innerHTML='<div class="nofeedbox">NO FEED</div>';
    $('red-push').innerHTML='';
  }else{
    fillVisible($('red-needs'), needs.map(one));
    fillVisible($('red-push'), push.length?push.map(one):['<div class="empty">Nothing to push</div>']);
  }

  $('col-work').innerHTML=`
    <div class="hd"><div class="kicker">Working</div>
      <div class="count">${D.action.state==='nofeed'&&!work.length?'–':work.length}<small>in motion</small></div></div>
    <div class="body" id="work-body"></div>`;
  const workHtml=D.action.state==='nofeed'&&!work.length?['<div class="nofeedbox">NO FEED</div>']:work.map(x=>{
    const d=CC.crmDays(x.since), known=x.pct!=null&&x.pct!=='';
    return `<div class="item">
      <div class="nm">${E(x.name)}</div>
      <div class="barwrap"><div class="bar ${known?'':'unk'}">${known?`<i style="width:${Math.max(0,Math.min(100,+x.pct))}%"></i>`:''}</div>
        <div class="pct ${known?'':'unk'}">${known?Math.round(+x.pct)+'%':'?%'}</div></div>
      <div class="meta"><span class="who">${E(x.next||'—')}</span>${x.detail?`<span class="rest">${E(x.detail)}</span>`:''}${CC.dayChip(d)}</div>
    </div>`;
  });
  fillVisible($('work-body'), workHtml);

  const down=(D.sitesL||[]).filter(s=>!s.up);
  const checks=[];
  if(D.sites.data){
    checks.push({lab:'Websites', val:D.sitesUp+'/'+D.sitesTotal, bad:down.length, detail:down.length?down.map(s=>s.host).join(', '):'all up'});
  }else checks.push({lab:'Websites', val:'NO FEED', bad:true});
  if(D.fresh.length){
    checks.push({lab:'Feed health', val:D.freshN+'/'+D.fresh.length, bad:D.freshN<D.fresh.length, detail:D.staleList.length?'stale: '+D.staleList.join(', ').replace(/_/g,' '):'fresh'});
  }
  const ghtml=[
    ...checks.map(c=>`<div class="check ${c.bad?'bad':'ok'}"><div class="lab">${E(c.lab)}${c.detail?` <span style="color:var(--dim);font-weight:600">· ${E(c.detail)}</span>`:''}</div><div class="val">${E(c.val)}</div></div>`),
    wins.length?`<div class="subh" style="color:var(--green)">Finished / went live · last 24h</div>`:'',
    ...wins.map(x=>rows([x],'win'))
  ].filter(Boolean);
  if(!wins.length) ghtml.push('<div class="empty">No projects finished in the last 24 hours</div>');
  $('col-green').innerHTML=`
    <div class="hd"><div class="kicker">Green</div>
      <div class="count">${checks.filter(c=>!c.bad).length+wins.length}<small>healthy${wins.length?' + '+wins.length+' new':''}</small></div></div>
    <div class="body" id="green-body"></div>`;
  fillVisible($('green-body'), ghtml);

  /* team strip: two wide, dot under the name. green=now, yellow=today, red=quiet */
  const roster=D.agents.data?D.roster:[];
  $('roster').innerHTML=D.agents.data?roster.map(r=>`<div class="ag ${r.state}" style="--c:${ST[r.state]}" title="${E(r.doing||'')}">
    <div class="nm">${E(r.name)}</div><i></i></div>`).join('')
    :'<div class="ag quiet" style="--c:var(--gray);grid-column:1/-1"><div class="nm">NO FEED</div><i></i></div>';

  /* Hey Genius live strip */
  const gSnap=f.snapshots&&f.snapshots.genius&&f.snapshots.genius.data;
  const gStEl=$('g-state'), gListEl=$('g-list');
  if(!gSnap){
    gStEl.className='g-pill'; gStEl.textContent='NO FEED';
    gListEl.innerHTML='<span class="g-empty">PC listener offline or not yet synced</span>';
  }else{
    const stRaw=String(gSnap.state||'Idle');
    const stLow=stRaw.toLowerCase();
    let cls='g-pill';
    if(stLow.includes('listen')) cls+=' listening';
    else if(stLow.includes('transcrib')) cls+=' transcribing';
    else if(stLow.includes('sent')) cls+=' sent';
    else if(stLow.includes('miss')) cls+=' missed';
    gStEl.className=cls;
    gStEl.textContent=stRaw.toUpperCase();
    const items=(gSnap.dispatches||[]).slice(0,3);
    const shortPt=t=>{const m=String(t||'').match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2}):\d{2}\s*(\w+)?/);if(!m)return String(t||'');let h=+m[2];const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m[3]} ${ap} ${m[4]||'PT'}`;};
    gListEl.innerHTML=items.length?items.map((x,idx)=>{
      const snip=String(x.text||'').replace(/\s+/g,' ').trim();
      const shortTxt=snip.length>38?snip.slice(0,37)+'…':snip;
      return `${idx?'<span class="g-sep">·</span>':''}<span class="g-item"><span class="g-tm">${E(shortPt(x.time_pt))}</span><span class="g-seat">${E(x.seat||'Benjamin')}</span><span class="g-txt">${E(shortTxt)}</span></span>`;
    }).join(''):'<span class="g-empty">No dispatches yet today</span>';
  }

  /* test hooks + stale */
  $('v-needs').textContent=needN;
  $('v-blocked').textContent=pushN;
  $('v-agents').textContent=D.agents.data?D.working:'–';
  $('v-sites').textContent=D.sitesTotal?D.sitesUp+'/'+D.sitesTotal:'–';
  $('v-feed').textContent=D.freshN+'/'+D.fresh.length;
  if(D.staleList.length) showBanner('stale','STALE DATA · '+D.staleList.join(' · ').replace(/_/g,' ').toUpperCase()); else showBanner('','');
  $('foot').textContent='Updated '+CC.time(f.generated_at,{hour:'numeric',minute:'2-digit',second:'2-digit'})+' PT · refresh 10s · Relay row '+(D.relay.data&&D.relay.data.tail_row||'–')+' · ? = no recorded date or % · day 0 = today';
  document.body.dataset.ready='1';
}

async function pull(){
  try{const f=await CC.load();LAST=f;LASTOK=Date.now();FAILS=0;$('setup').style.display='none';render(f);}
  catch(e){FAILS++;
    if(e.code==="nokey"||e.code==="badkey"){$("setup").style.display="flex";$("setupmsg").textContent=e.code==="badkey"?"This link's key was rejected. Ask Benjamin for the current TV link.":"Open this board with its private link (it ends in #k=...).";}
    else if(!LAST) showBanner('err','CONNECTING TO FEED… ('+e.message+')');
    document.body.dataset.ready='err';}
}
tick();setInterval(tick,1000);pull();setInterval(pull,10e3);
let dk=0;const DR=[[0,0],[4,3],[-3,4],[3,-4],[-4,-3],[2,2]];setInterval(()=>{dk=(dk+1)%DR.length;$('wrap').style.transform=`translate(${DR[dk][0]}px,${DR[dk][1]}px)`},240e3);
setTimeout(()=>location.reload(),6*3600e3);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.documentElement.style.transformOrigin='0 0';document.documentElement.style.transform=s<0.999||s>1.001?`scale(${s})`:'';}
addEventListener('resize',fit);fit();
</script>
</body></html>
